name: Deploy PPE

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ppe
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-ppe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # PPE is dispatched by hand, from any ref: the gate matters more here,
      # not less, because no Verify run is implied.
      - name: Verify types
        run: npm run typecheck
      - name: Verify tests
        run: npm test
      - name: Verify target account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: test "$CLOUDFLARE_ACCOUNT_ID" = "4e8ec9b758de0cf1e392f7e2d916e96f"
      # The migration mutates the database, so prove the bundle builds and every
      # binding resolves before it runs. A build failure discovered afterwards
      # leaves a migrated database in front of the previous Worker.
      - name: Build the Worker without deploying it
        run: npx wrangler deploy --dry-run --config wrangler.ppe.jsonc
      # Before the Worker, never after: a deploy against an unmigrated database
      # answers every endpoint with a 500.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run db:migrate:ppe
      - name: Deploy PPE Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:ppe
